services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cinema-phpmyadmin
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: 123456
    depends_on:
      - mysql
  mysql:
    image: mysql:8.0
    container_name: cinema-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: movie_db
    ports:
      - "3307:3306"
      - "3308:3306"
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
      - ./docker/mysql/init/02-create-tables.sql:/docker-entrypoint-initdb.d/02-create-tables.sql:ro
      - ./docker/mysql/init/03-create-platform-services.sql:/docker-entrypoint-initdb.d/03-create-platform-services.sql:ro
      - ./backend/sample-data.sql:/docker-entrypoint-initdb.d/04-sample-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - mysql-movie
          - mysql-showtime
          - mysql-booking

  rabbitmq:
    image: rabbitmq:management
    container_name: cinema-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 123456

  redis:
    image: redis:7.2-alpine
    container_name: cinema-redis
    ports:
      - "6379:6379"

  eureka-server:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: cinema-eureka-server
    working_dir: /app
    volumes:
      - ./backend/eureka-server:/app
      - maven_eureka:/root/.m2
    command: mvn spring-boot:run
    ports:
      - "8761:8761"

  api-gateway:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: cinema-api-gateway
    working_dir: /app
    volumes:
      - ./backend/api-gateway:/app
      - maven_gateway:/root/.m2
    command: mvn spring-boot:run
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      APP_JWT_SECRET: cinema-management-system-demo-secret-key-please-change
    ports:
      - "18080:8080"
    depends_on:
      - eureka-server
      - redis

  movie-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: cinema-movie-service
    working_dir: /app
    volumes:
      - ./backend/movie-service:/app
      - maven_movie:/root/.m2
    command: mvn spring-boot:run
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_URL: jdbc:mysql://mysql:3306/movie_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_JWT_SECRET: cinema-management-system-demo-secret-key-please-change
    ports:
      - "18081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  showtime-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: cinema-showtime-service
    working_dir: /app
    volumes:
      - ./backend/showtime-service:/app
      - maven_showtime:/root/.m2
    command: mvn spring-boot:run
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/showtime_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_JWT_SECRET: cinema-management-system-demo-secret-key-please-change
    ports:
      - "18082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  booking-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: cinema-booking-service
    working_dir: /app
    volumes:
      - ./backend/booking-service:/app
      - maven_booking:/root/.m2
    command: mvn spring-boot:run
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_JWT_SECRET: cinema-management-system-demo-secret-key-please-change
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: 123456
    ports:
      - "18083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      rabbitmq:
        condition: service_started

  user-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: cinema-user-service
    working_dir: /app
    volumes:
      - ./backend/user-service:/app
      - maven_user:/root/.m2
    command: mvn spring-boot:run
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      APP_JWT_SECRET: cinema-management-system-demo-secret-key-please-change
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:5173}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-true}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-your-email@gmail.com}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_STARTTLS: ${SPRING_MAIL_STARTTLS:-true}
    ports:
      - "18084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      redis:
        condition: service_started

  payment-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: cinema-payment-service
    working_dir: /app
    volumes:
      - ./backend/payment-service:/app
      - maven_payment:/root/.m2
    command: mvn spring-boot:run
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_JWT_SECRET: cinema-management-system-demo-secret-key-please-change
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: 123456
      PAYMENT_CALLBACK_SECRET: cinema-payment-callback-demo-secret
    ports:
      - "18085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      rabbitmq:
        condition: service_started

  notification-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: cinema-notification-service
    working_dir: /app
    volumes:
      - ./backend/notification-service:/app
      - maven_notification:/root/.m2
    command: mvn spring-boot:run
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_JWT_SECRET: cinema-management-system-demo-secret-key-please-change
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: 123456
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-no-reply@cinema.local}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-90}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_STARTTLS: ${SPRING_MAIL_STARTTLS:-true}
    ports:
      - "18086:8086"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      rabbitmq:
        condition: service_started

  media-service:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: cinema-media-service
    working_dir: /app
    volumes:
      - ./backend/media-service:/app
      - media_uploads:/app/uploads
      - maven_media:/root/.m2
    command: mvn spring-boot:run
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/media_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_JWT_SECRET: cinema-management-system-demo-secret-key-please-change
      MEDIA_UPLOAD_DIR: /app/uploads
    ports:
      - "18087:8087"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

volumes:
  mysql_data:
  maven_eureka:
  maven_gateway:
  maven_movie:
  maven_showtime:
  maven_booking:
  maven_user:
  maven_payment:
  maven_notification:
  maven_media:
  media_uploads:
