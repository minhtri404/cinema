spring.application.name=booking-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3307/booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
app.booking.seat-hold-ttl-seconds=${BOOKING_SEAT_HOLD_TTL_SECONDS:600}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

product-service.base-url=${PRODUCT_SERVICE_BASE_URL:http://movie-service}
resilience4j.circuitbreaker.instances.productService.sliding-window-size=5
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=2

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:123456}
app.messaging.notification-exchange=${NOTIFICATION_EXCHANGE:cinema.events}
app.messaging.notification-routing-key=${NOTIFICATION_ROUTING_KEY:notification.requested}

app.jwt.secret=${APP_JWT_SECRET:cinema-management-system-demo-secret-key-please-change}

springdoc.swagger-ui.path=/swagger-ui.html
