spring.datasource.url=jdbc:h2:mem:notification_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
eureka.client.enabled=false
app.jwt.secret=cinema-management-system-demo-secret-key-please-change
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.dynamic=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
app.notification.email-enabled=false
app.notification.from-email=no-reply@test.local
app.messaging.notification-exchange=cinema.events.test
app.messaging.notification-queue=notification.requests.test
app.messaging.notification-routing-key=notification.requested
