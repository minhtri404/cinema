spring.application.name=notification-service
server.port=8086

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:123456}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.messaging.notification-exchange=${NOTIFICATION_EXCHANGE:cinema.events}
app.messaging.notification-queue=${NOTIFICATION_QUEUE:notification.requests}
app.messaging.notification-routing-key=${NOTIFICATION_ROUTING_KEY:notification.requested}

app.notification.email-enabled=${NOTIFICATION_EMAIL_ENABLED:false}
app.notification.from-email=${NOTIFICATION_FROM_EMAIL:no-reply@cinema.local}
app.notification.retention-days=${NOTIFICATION_RETENTION_DAYS:90}
app.notification.cleanup-cron=${NOTIFICATION_CLEANUP_CRON:0 0 3 * * *}
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
app.jwt.secret=${APP_JWT_SECRET:cinema-management-system-demo-secret-key-please-change}
springdoc.swagger-ui.path=/swagger-ui.html
