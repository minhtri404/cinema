server.port=8080

spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

app.jwt.secret=${APP_JWT_SECRET:cinema-management-system-demo-secret-key-please-change}

springdoc.swagger-ui.path=/swagger-ui.html

spring.cloud.gateway.server.webmvc.routes[0].id=movie-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://movie-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/movies/**,/api/genres/**,/api/events/**,/api/news/**,/api/advertisements/**,/api/uploads/**

spring.cloud.gateway.server.webmvc.routes[1].id=showtime-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://showtime-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/showtimes/**,/api/theaters/**,/api/rooms/**,/api/seats/**

spring.cloud.gateway.server.webmvc.routes[2].id=booking-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://booking-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/bookings/**,/api/ticket-pricing/**,/api/ticket-surcharges/**,/api/promotions/**,/api/foods/**


spring.cloud.gateway.server.webmvc.routes[3].id=user-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/auth/**,/api/users/**

spring.cloud.gateway.server.webmvc.routes[4].id=payment-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/payments/**,/payment-callbacks/**

spring.cloud.gateway.server.webmvc.routes[5].id=notification-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.server.webmvc.routes[6].id=media-service
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://media-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/media/**,/media/**
