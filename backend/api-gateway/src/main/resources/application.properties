server.port=8080

spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=movie-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://movie-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/movies/**

spring.cloud.gateway.server.webflux.routes[1].id=showtime-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://showtime-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/showtimes/**

spring.cloud.gateway.server.webflux.routes[2].id=booking-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/bookings/**