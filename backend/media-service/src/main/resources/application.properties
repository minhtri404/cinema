spring.application.name=media-service
server.port=8087

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/media_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
app.jwt.secret=${APP_JWT_SECRET:cinema-management-system-demo-secret-key-please-change}
app.media.upload-dir=${MEDIA_UPLOAD_DIR:uploads}
app.media.max-image-size-bytes=${MEDIA_MAX_IMAGE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
springdoc.swagger-ui.path=/swagger-ui.html
